# ─────────────────────────────────────────────────────────────────────────────
# Traefik DYNAMISK config (file provider).
# Legges på TRAEFIK-VM-EN, i mappa Traefik leser dynamiske filer fra
# (typisk /etc/traefik/dynamic/). Plukkes opp automatisk hvis file provider
# kjører med "watch: true" — ellers restart Traefik én gang.
#
# Sjekk at disse to stemmer med DIN Traefik (statisk config), samme som for
# treningsapp/run:
#   websecure           → navnet på din HTTPS-entrypoint (port 443)
#   letsencrypt         → navnet på din certificate resolver
# ─────────────────────────────────────────────────────────────────────────────

http:
  routers:
    stronger:
      rule: "Host(`stronger.vikane.cloud`)"
      entryPoints:
        - websecure
      service: stronger-svc
      tls:
        certResolver: letsencrypt

  services:
    stronger-svc:
      loadBalancer:
        passHostHeader: true
        servers:
          # ← IP-en til APP-VM-en (samme VM som treningsapp/run), port 3002
          - url: "http://192.168.1.25:3002"
