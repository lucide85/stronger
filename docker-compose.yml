# Kjøres på app-VM-en (samme VM som treningsapp/run, men egen container + port).
# Traefik står på en annen VM og ruter over nettverket til http://<APP_VM_IP>:3002.
services:
  stronger:
    build: .
    image: stronger:latest
    container_name: stronger
    restart: unless-stopped
    # init-prosess videresender SIGTERM riktig ved `docker stop`
    init: true
    ports:
      # Eksponer porten på app-VM-en slik at Traefik-VM-en når den.
      # Vil du kun slippe inn Traefik, bind til LAN-IP-en: "192.168.x.y:3002:3002"
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=file:/app/server/prisma/data/stronger.db
    volumes:
      # Hemmeligheter (Anthropic-nøkkel, VAPID-nøkler, sessionSecret) – read-only
      - ./config.json:/app/config.json:ro
      # Persistente data (SQLite-databasen) – overlever omstart/oppdatering
      - stronger-data:/app/server/prisma/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  stronger-data:
